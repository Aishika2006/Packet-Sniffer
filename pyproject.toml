[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-sniffer"
version = "0.1.0"
description = "A modular packet sniffer with layered architecture in Python 3.10+ using Scapy"
authors = [{ name = "Network Security Diagnostics" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
packet-sniffer = "sniffer.main:main"
